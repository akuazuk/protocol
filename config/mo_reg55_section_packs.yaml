      - point: "40.4"
        title: "Рентгенпрофилактика ОГК в документах"
        group: documentation
        rule: na_unless_age_gte
        min_age_years: 18
        na_reason: "Критерий взрослых / неприменим по возрасту"
      - point: "40.5"
        title: "МО по Инструкции №127"
        group: documentation
        rule: mo_per_127
        fields: [complaints, anamnesis_doctor, objective_status, clinical_diagnosis]
        evidence_from_127: true
      - point: "40.6"
        title: "АД и факторы риска по результатам МО"
        group: documentation
        rule: risk_vitals
        fields: [objective_status, anamnesis_doctor]
        evidence_from_127: true
      - point: "40.7"
        title: "Нет дублирования/необоснованных исследований"
        group: documentation
