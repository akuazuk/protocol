<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Навигация по протоколу</title>
  <link rel="icon" href="/protocol-logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/protocol-chrome-tabs.css?v=__BUILD_VERSION__" />
  <link rel="stylesheet" href="/mo-tokens.css?v=__BUILD_VERSION__" />
  <link rel="stylesheet" href="/mo-protocol-viewer.css?v=__BUILD_VERSION__" />
  <script>
    if (new URLSearchParams(location.search).get("from") === "mo") {
      document.documentElement.classList.add("pv-from-mo");
    }
  </script>
</head>
<body class="app-tab-search pv-mo">
  <div class="app-chrome" id="app-chrome">
    <div class="app-chrome__masthead">
      <a class="app-chrome__brand" href="/" aria-label="Protocol - на главную">
        <img class="app-sticky-bar__logo" src="/protocol-logo-mini.svg" width="132" height="15" alt="Protocol" />
      </a>
    </div>
    <div class="app-chrome__journal">
      <nav class="app-main-tabs app-main-tabs--journal app-main-tabs--primary" aria-label="Раздел приложения">
        <a href="/#consult-review" class="app-main-tab"><span class="app-main-tab-title">Проверка</span></a>
        <a href="/#search" class="app-main-tab" aria-current="page"><span class="app-main-tab-title">Поиск</span></a>
        <a href="/patient.html" class="app-main-tab app-main-tab--patient"><span class="app-main-tab-title">После приема</span></a>
      </nav>
    </div>
  </div>
  <header class="pv-header">
    <div class="pv-header__wrap">
      <p class="pv-eyebrow">Клинический протокол</p>
      <h1 class="pv-title" id="pv-title">Навигация по протоколу</h1>
      <div class="pv-meta" id="pv-meta"></div>
    </div>
  </header>
  <main class="pv-main" id="pv-root">
    <p class="pv-loading" id="pv-status">Загрузка протокола…</p>
  </main>
  <script>
  (function () {
    var SEARCH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
    var RESET_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>';
    var PDF_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';

    var state = { mode: "study", reader: null, brief: null, path: "", q: "" };

    function qp(name) { return new URLSearchParams(location.search).get(name) || ""; }
    function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
    function escAttr(s) { return esc(s); }
    function escRx(s) { return String(s || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
    function norm(s) { return String(s || "").toLowerCase().replace(/ё/g, "е"); }
    function pdfHref(path, page) {
      var u = "/api/protocol-pdf?path=" + encodeURIComponent(path || "");
      var n = Number(page);
      return (page && n > 0) ? (u + "#page=" + n) : u;
    }
    function hl(text, terms) {
      var e = esc(text);
      var list = (Array.isArray(terms) ? terms : [terms]).map(function (t) { return String(t || "").trim(); }).filter(function (t) { return t.length >= 3; });
      if (!list.length) return e;
      list.sort(function (a, b) { return b.length - a.length; });
      try { return e.replace(new RegExp("(" + list.map(escRx).join("|") + ")", "gi"), '<mark class="pv-mark">$1</mark>'); }
      catch (err) { return e; }
    }
    function queryTerms(q) {
      return norm(q).split(/[^a-zа-я0-9]+/i).filter(function (t) { return t.length >= 3; });
    }

    function fetchReader(path, query) {
      var u = "/api/protocol-reader?path=" + encodeURIComponent(path) + "&query=" + encodeURIComponent(query || "");
      return fetch(u, { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
    }
    function fetchBrief(path, query) {
      var u = "/api/protocol-brief?path=" + encodeURIComponent(path) + "&query=" + encodeURIComponent(query || "");
      return fetch(u, { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
    }

    function renderMeta(sourceLabel, titleHint) {
      var el = document.getElementById("pv-meta");
      var out = "";
      if (sourceLabel) out += '<span class="pv-chip pv-chip--src" title="Источник текста">' + esc(sourceLabel) + "</span>";
      if (titleHint) out += '<span class="pv-chip">' + esc(titleHint) + "</span>";
      el.innerHTML = out;
    }

    function toolbarHtml(path) {
      return '<div class="pv-modes" role="tablist" aria-label="Режим навигации">' +
        '<button type="button" data-mode="study" class="' + (state.mode === "study" ? "is-active" : "") + '">Изучение</button>' +
        '<button type="button" data-mode="visit" class="' + (state.mode === "visit" ? "is-active" : "") + '">Кратко</button>' +
        "</div>" +
        '<div class="pv-toolbar">' +
        '<div class="pv-search-wrap">' +
        '<input class="pv-search" id="pv-search" type="search" placeholder="Найти в протоколе…" value="' + escAttr(state.q) + '" autocomplete="off" />' +
        '<button type="button" class="pv-icon-btn" id="pv-reset" title="Сбросить" aria-label="Сбросить">' + RESET_SVG + "</button>" +
        '<button type="button" class="pv-icon-btn pv-icon-btn--go" id="pv-go" title="Найти" aria-label="Найти">' + SEARCH_SVG + "</button>" +
        "</div>" +
        (qp("page") ? '<a class="pv-pdf-btn pv-pdf-btn--primary" href="' + escAttr(pdfHref(path, qp("page"))) + '" target="_blank" rel="noopener">' + PDF_SVG + " Оригинал · стр. " + esc(qp("page")) + "</a>" : "") +
        '<a class="pv-pdf-btn" href="' + escAttr(pdfHref(path)) + '" target="_blank" rel="noopener">' + PDF_SVG + " PDF целиком</a>" +
        "</div>";
    }

    function paraHtml(path, p, terms, anchorPage) {
      var pageHit = anchorPage && String(p.page_start || "") === String(anchorPage);
      var raw = String(p.text || "");
      var long = raw.length > 1100;
      var html = '<article class="pv-para' + (pageHit ? " is-page-hit" : "") + '" data-pv-para data-sec="' + escAttr(p.section_id) + '"' +
        (p.page_start ? ' data-page="' + escAttr(p.page_start) + '"' : "") + ' id="pv-p-' + escAttr(p.id) + '">';
      html += '<p class="pv-para__text' + (long ? " is-clamped" : "") + '" data-raw="' + escAttr(raw) + '">' + hl(raw, terms) + "</p>";
      if (long) html += '<button type="button" class="pv-para__more" data-expand>Показать полностью</button>';
      var ents = p.entities || {};
      var chips = "";
      (ents.drugs || []).slice(0, 6).forEach(function (d) { chips += '<span class="pv-ent__chip">' + esc(d) + "</span>"; });
      (ents.exams || []).slice(0, 6).forEach(function (d) { chips += '<span class="pv-ent__chip pv-ent__chip--exam">' + esc(d) + "</span>"; });
      if (chips) html += '<div class="pv-ent">' + chips + "</div>";
      var anns = p.annotations || [];
      if (anns.length) {
        html += '<div class="pv-ann">';
        anns.forEach(function (a) { html += '<span class="pv-ann__chip">' + esc(a.label || a.kind || "") + "</span>"; });
        html += "</div>";
      }
      html += '<div class="pv-para__meta">';
      if (p.page_start) {
        html += '<a class="pv-para__page" href="' + escAttr(pdfHref(path, p.page_start)) + '" target="_blank" rel="noopener">Оригинал · стр. ' + esc(p.page_start) + "</a>";
      }
      html += "</div></article>";
      return html;
    }

    function renderStudy(path, reader) {
      var root = document.getElementById("pv-root");
      var terms = queryTerms(state.q);
      var toc = reader.toc || [];
      var paras = reader.paragraphs || [];
      var bySec = {};
      paras.forEach(function (p) {
        if (!bySec[p.section_id]) bySec[p.section_id] = [];
        bySec[p.section_id].push(p);
      });
      var html = toolbarHtml(path);
      if (!(reader.source)) {
        html += '<div class="pv-fallback-banner">Показаны абзацы из текста протокола. Сверяйте спорные места с PDF.</div>';
      }
      html += '<div class="pv-layout"><nav class="pv-rail" id="pv-rail"><p class="pv-rail__title">Разделы</p></nav><div class="pv-stream" id="pv-stream"></div></div>';
      root.innerHTML = html;

      var rail = document.getElementById("pv-rail");
      var stream = document.getElementById("pv-stream");
      toc.forEach(function (sec) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "pv-rail__item";
        b.setAttribute("data-rail", sec.id);
        b.innerHTML = "<span>" + esc(sec.label) + '</span><span class="pv-rail__count">' + esc(sec.count) + "</span>";
        b.addEventListener("click", function () { jumpTo(sec.id); });
        rail.appendChild(b);
      });

      var body = "";
      toc.forEach(function (sec) {
        var list = bySec[sec.id] || [];
        if (!list.length) return;
        body += '<section class="pv-section" id="pv-sec-' + escAttr(sec.id) + '" data-sec="' + escAttr(sec.id) + '">';
        body += '<div class="pv-section__head"><h2 class="pv-section__title">' + esc(sec.label) + '</h2><span class="pv-section__rule"></span></div>';
        list.forEach(function (p) { body += paraHtml(path, p, terms, qp("page")); });
        body += "</section>";
      });
      stream.innerHTML = body || '<p class="pv-empty">Нет абзацев по запросу.</p>';

      wireChrome(path);
      wireExpand(stream);
      applyFilter(state.q);
      deepLink();
    }

    function renderVisit(path, brief) {
      var root = document.getElementById("pv-root");
      var html = toolbarHtml(path);
      html += '<div class="pv-fallback-banner">Режим «Кратко» - сжатые выводы для приёма. Для чтения протокола переключитесь на «Изучение».</div>';
      html += '<div class="pv-stream" id="pv-stream">';
      (brief.sections || []).forEach(function (sec) {
        html += '<section class="pv-section" id="pv-sec-' + escAttr(sec.id) + '"><div class="pv-section__head"><h2 class="pv-section__title">' + esc(sec.label) + '</h2><span class="pv-section__rule"></span></div>';
        (sec.points || []).forEach(function (pt) {
          html += '<article class="pv-point"><p class="pv-point__text">' + esc(pt.text || "") + "</p>";
          if (pt.page_start) {
            html += '<div class="pv-point__meta"><a class="pv-point__page" href="' + escAttr(pdfHref(path, pt.page_start)) + '" target="_blank" rel="noopener">Оригинал · стр. ' + esc(pt.page_start) + "</a></div>";
          }
          html += "</article>";
        });
        html += "</section>";
      });
      html += "</div>";
      root.innerHTML = html;
      wireChrome(path);
    }

    function jumpTo(id) {
      var el = document.getElementById("pv-sec-" + id);
      if (!el) return;
      el.scrollIntoView({ behavior: "smooth", block: "start" });
      setActiveRail(id);
    }
    function setActiveRail(id) {
      var rail = document.getElementById("pv-rail");
      if (!rail) return;
      rail.querySelectorAll("[data-rail]").forEach(function (b) {
        b.classList.toggle("is-active", b.getAttribute("data-rail") === id);
      });
    }
    function deepLink() {
      var wantSec = qp("section");
      var wantPage = qp("page");
      if (wantSec) jumpTo(wantSec);
      if (wantPage) {
        var hit = document.querySelector('.pv-para[data-page="' + wantPage + '"]');
        if (hit) {
          hit.scrollIntoView({ behavior: "smooth", block: "center" });
          var sec = hit.getAttribute("data-sec");
          if (sec) setActiveRail(sec);
        }
      } else if (!wantSec) {
        var first = (state.reader && state.reader.toc && state.reader.toc[0]) || null;
        if (first) setActiveRail(first.id);
      }
    }
    function wireExpand(root) {
      root.querySelectorAll("[data-expand]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var p = btn.previousElementSibling;
          if (p) p.classList.remove("is-clamped");
          btn.remove();
        });
      });
    }
    function applyFilter(q) {
      var qs = String(q || "").trim();
      var terms = queryTerms(qs);
      var stream = document.getElementById("pv-stream");
      if (!stream) return;
      stream.querySelectorAll(".pv-section").forEach(function (sec) {
        var visible = 0;
        sec.querySelectorAll("[data-pv-para]").forEach(function (node) {
          var raw = (node.querySelector(".pv-para__text") || {}).getAttribute
            ? node.querySelector(".pv-para__text").getAttribute("data-raw")
            : node.textContent;
          var txt = norm(raw || node.textContent || "");
          var ok = !qs || qs.length < 2 || !terms.length || terms.some(function (t) { return txt.indexOf(t) >= 0; });
          node.hidden = !ok;
          if (ok) {
            visible++;
            var p = node.querySelector(".pv-para__text");
            if (p) {
              var base = p.getAttribute("data-raw") || p.textContent;
              p.setAttribute("data-raw", base);
              p.innerHTML = hl(base, qs.length >= 2 ? terms : []);
            }
          }
        });
        sec.style.display = (qs.length >= 2 && visible === 0) ? "none" : "";
      });
    }
    function wireChrome(path) {
      document.querySelectorAll("[data-mode]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var mode = btn.getAttribute("data-mode");
          if (!mode || mode === state.mode) return;
          state.mode = mode;
          paint();
        });
      });
      var search = document.getElementById("pv-search");
      var go = document.getElementById("pv-go");
      var reset = document.getElementById("pv-reset");
      function run() {
        state.q = (search && search.value) || "";
        if (state.mode === "study") applyFilter(state.q);
        else paint();
      }
      if (go) go.addEventListener("click", run);
      if (reset) reset.addEventListener("click", function () {
        if (search) search.value = "";
        state.q = "";
        run();
      });
      if (search) {
        search.addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); run(); } });
        var t;
        search.addEventListener("input", function () { clearTimeout(t); t = setTimeout(run, 280); });
      }
    }

    function paint() {
      var path = state.path;
      if (state.mode === "visit") {
        if (state.brief && state.brief.available && (state.brief.sections || []).length) {
          document.getElementById("pv-title").textContent = state.brief.title || state.reader && state.reader.title || "Протокол";
          renderMeta("кратко", "режим приёма");
          renderVisit(path, state.brief);
          return;
        }
        // lazy load brief
        document.getElementById("pv-status") && (document.getElementById("pv-root").innerHTML = '<p class="pv-loading">Загрузка кратких выводов…</p>');
        fetchBrief(path, state.q).then(function (brief) {
          state.brief = brief;
          if (brief && brief.available && (brief.sections || []).length) paint();
          else {
            state.mode = "study";
            paint();
          }
        });
        return;
      }
      if (state.reader && state.reader.available && (state.reader.paragraphs || []).length) {
        document.getElementById("pv-title").textContent = state.reader.title || "Протокол Минздрава";
        document.title = (state.reader.title || "Протокол") + " - навигация";
        var src = state.reader.source === "rich_chunks" ? "из текста (чанки)" : "из текста протокола";
        renderMeta(src, (state.reader.stats && state.reader.stats.paragraphs ? (state.reader.stats.paragraphs + " абз.") : ""));
        renderStudy(path, state.reader);
        return;
      }
      showPdfOnly(path, "Абзацы протокола пока недоступны. Откройте оригинал PDF.");
    }

    function showPdfOnly(path, message) {
      var root = document.getElementById("pv-root");
      document.getElementById("pv-title").textContent = "Клинический протокол";
      root.innerHTML =
        '<p class="pv-empty">' + esc(message) + "</p>" +
        '<p style="text-align:center">' +
        (qp("page") ? '<a class="pv-pdf-btn pv-pdf-btn--primary" href="' + escAttr(pdfHref(path, qp("page"))) + '" target="_blank" rel="noopener">' + PDF_SVG + " Оригинал · стр. " + esc(qp("page")) + "</a> " : "") +
        '<a class="pv-pdf-btn" href="' + escAttr(pdfHref(path)) + '" target="_blank" rel="noopener">' + PDF_SVG + " Открыть PDF</a></p>";
    }

    state.path = qp("path");
    state.q = qp("q");
    if (!state.path) {
      document.getElementById("pv-status").textContent = "Не указан протокол.";
      return;
    }
    fetchReader(state.path, state.q).then(function (reader) {
      state.reader = reader;
      if (reader && reader.available && (reader.paragraphs || []).length) {
        paint();
        return;
      }
      // fallback to brief visit if reader empty
      return fetchBrief(state.path, state.q).then(function (brief) {
        state.brief = brief;
        if (brief && brief.available && (brief.sections || []).length) {
          state.mode = "visit";
          paint();
        } else {
          showPdfOnly(state.path, "Навигация по протоколу недоступна. Откройте оригинал PDF.");
        }
      });
    }).catch(function () {
      document.getElementById("pv-status").textContent = "Ошибка загрузки.";
    });
  })();
  </script>
</body>
</html>
