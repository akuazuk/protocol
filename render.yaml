# Настройки для Render Blueprint / справочно для ручного сервиса.
# PYTHON_VERSION: в Dashboard → Environment добавьте вручную, если сборка тянет Python 3.14.
# https://render.com/docs/python-version
#
# Тяжёлые corpus_chunks_parts/*.jsonl лучше не коммитить в git: подключите Persistent Disk,
# один раз залейте туда каталог corpus_chunks_parts (SSH / scp / скрипт), задайте RAG_CHUNKS_DIR.
# https://render.com/docs/disks
#
# plan: standard = 2 GiB RAM / 1 CPU (~$25/мес). Синхронизируйте Blueprint в Dashboard
# или вручную: Settings → Instance Type → Standard.

services:
  - type: web
    name: protocol-rag
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: bash -c 'echo "Starting uvicorn on port ${PORT}" && exec uvicorn rag_server:app --host 0.0.0.0 --port "$PORT" --log-level info'
    healthCheckPath: /health/live
    # Persistent Disk: создайте диск в Dashboard, залейте corpus_chunks_parts → /var/data
    # (см. docs/deploy/persistent_disk.md), затем синхронизируйте Blueprint.
    disk:
      name: rag-chunks
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: RENDER_PLAN
        value: standard
      # Второй RAG-pass + несколько вызовов Gemini часто превышают таймаут прокси Render (~100 с).
      - key: CONSULT_REVIEW_RAG_SECOND_PASS
        value: "0"
      - key: RAG_CHUNKS_DIR
        value: /var/data
      - key: RAG_PRECOMPUTED_CHUNK_EMBED
        value: "1"
      - key: RATE_LIMIT_CONSULT_PER_MIN
        value: "2"
      - key: RATE_LIMIT_ASSIST_PER_MIN
        value: "10"
      - key: RATE_LIMIT_PRACTICAL_PER_MIN
        value: "5"
      - key: RAG_SEARCH_REQUIRE_ALLOWLIST_ON_RENDER
        value: "1"
      - key: SEARCH_CONCURRENCY
        value: "2"
      - key: RAG_CHUNK_VOTE_RERETRIEVE
        value: "0"
      - key: RAG_STARTUP_LOAD_DELAY_SEC
        value: "2"
      - key: RAG_MEMORY_SAVER
        value: "1"
      - key: RAG_LEX_BM25_ALPHA
        value: "1.0"
      - key: RAG_EMBED_POOL_MERGE
        value: "0"
      - key: RAG_GEMINI_EMBED_RERANK
        value: "0"
      - key: CONSULT_REVIEW_MAX_CHUNKS
        value: "8"
      - key: CONSULT_RENDER_L2_LITE
        value: "1"
      - key: CONSULT_RENDER_L2_SKIP_LLM
        value: "0"
      - key: PROTOCOL_SUMMARY_RAG_MERGE
        value: "0"
      - key: RAG_LEX_MAX_CANDIDATES
        value: "8000"
      - key: RAG_LEX_MAX_UNION
        value: "20000"
      - key: RAG_RETRIEVE_CONCURRENCY
        value: "2"
      - key: CONSULT_CONCURRENCY
        value: "2"
      - key: CONSULT_TYPED_RETRIEVE
        value: "0"
      - key: RAG_LEXICAL_MAX_CHARS
        value: "4096"
      - key: CONSULT_PREWARM_PROTOCOL_ICD_INDEX
        value: "0"
      - key: CONSULT_PREWARM_SUMMARY_ICD_INDEX
        value: "0"
      - key: RAG_LEX_INDEX_DEFER
        value: "1"
      - key: CONSULT_ALIGNMENT_ENABLED
        value: "1"
      # Persistent Disk на /var/data обязателен, если задан ML_FEEDBACK_DIR=/var/data/ml/feedback
      # - key: ML_FEEDBACK_DIR
      #   value: /var/data/ml/feedback
