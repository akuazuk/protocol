        fields: [exam_recommendations, treatment_recommendations]
        block_score_key: exams
      - point: "39.3"
        title: "Диагноз + МКБ-10"
        group: clinical
        rule: diagnosis_icd
        fields: [clinical_diagnosis, mis_diagnos]
      - point: "39.4"
        title: "Диагностика выполнена по плану и КП"
        group: clinical
        rule: diagnostics_completed
        fields: [exam_data]
        na_reason: "Диагностика на визите не выполнена"
      - point: "39.5"
        title: "Лечение по КП"
        group: clinical
        rule: plan_text
        fields: [treatment_recommendations]
        block_score_key: treatment
      - point: "39.6"
        title: "Коррекция плана обследования"
        group: clinical
        rule: na_unless_prior_visit
        fields: [exam_recommendations]
        na_reason: "Нет предыдущего визита"
      - point: "39.7"
        title: "Коррекция лечения"
        group: clinical
        rule: na_unless_prior_visit
        fields: [treatment_recommendations]
        na_reason: "Нет предыдущего визита"
      - point: "39.8"
        title: "Кратность медицинского наблюдения"
        group: clinical
        rule: follow_up
        fields: [treatment_recommendations, exam_recommendations, follow_up]
        evidence_from_127: true
      - point: "40.1"
        title: "Оформление документов по формам"
        group: documentation
        rule: docs_structured
        fields: [complaints, anamnesis_doctor, objective_status, clinical_diagnosis]
        evidence_from_127: true
      - point: "40.2"
        title: "Ведение ЭМК"
        group: documentation
