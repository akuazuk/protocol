<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Навигация по протоколу</title>
  <style>
    :root {
      --green-700: #1a8a72;
      --green-800: #146b59;
      --bg: #f4f7f6;
      --card: #fff;
      --line: rgba(203, 213, 225, 0.75);
      --text: #1e293b;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }
    .pv-header {
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(255,255,255,0.96);
      border-bottom: 1px solid var(--line);
      padding: 0.65rem 1rem;
      backdrop-filter: blur(6px);
    }
    .pv-title {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--green-800);
    }
    .pv-sub {
      margin: 0.2rem 0 0;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .pv-sub:empty { display: none; }
    .protocol-src-intent-chips {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }
    .protocol-src-intent-chip {
      font: inherit;
      font-size: 0.7rem;
      font-weight: 650;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #f8fafc;
      color: #334155;
      cursor: pointer;
    }
    .protocol-src-intent-chip.is-active {
      border-color: rgba(26,138,114,0.55);
      background: rgba(214,243,232,0.95);
      color: #034a3c;
    }
    .protocol-src-overview {
      grid-column: 1 / -1;
      border-radius: 12px;
      border: 1px solid rgba(26, 138, 114, 0.28);
      background: linear-gradient(180deg, rgba(232, 245, 241, 0.82), #fff);
      padding: 0.62rem 0.72rem;
    }
    .protocol-src-overview.is-empty { display: none; }
    .protocol-src-overview.is-loading { opacity: 0.82; }
    .protocol-src-overview__title {
      margin: 0 0 0.3rem;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--green-800);
    }
    .protocol-src-overview__summary {
      margin: 0;
      font-size: 0.78rem;
      color: #1e293b;
      line-height: 1.45;
    }
    .protocol-src-overview__points {
      margin: 0.42rem 0 0;
      padding-left: 1.05rem;
      font-size: 0.76rem;
      color: #334155;
    }
    .protocol-src-overview__point { margin: 0.22rem 0; }
    .protocol-src-overview__cite {
      display: inline-block;
      margin-left: 0.25rem;
      font-size: 0.67rem;
      color: #64748b;
    }
    .pv-main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.75rem 0.85rem 1.25rem;
    }
    .protocol-src-viewer {
      display: grid;
      grid-template-columns: minmax(11rem, 13rem) 1fr;
      gap: 0.55rem;
      min-height: calc(100vh - 5.5rem);
    }
    @media (max-width: 760px) {
      .protocol-src-viewer { grid-template-columns: 1fr; }
    }
    .protocol-src-toolbar {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
      padding: 0.45rem 0.55rem;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card);
    }
    .protocol-src-search {
      flex: 1 1 12rem;
      font: inherit;
      font-size: 0.82rem;
      padding: 0.42rem 0.62rem;
      border-radius: 9px;
      border: 1px solid var(--line);
    }
    .protocol-src-open-tab, .pv-pdf-btn {
      font: inherit;
      font-size: 0.72rem;
      font-weight: 650;
      padding: 0.34rem 0.58rem;
      border-radius: 8px;
      border: 1px solid rgba(26,138,114,0.35);
      background: rgba(232,245,241,0.95);
      color: var(--green-800);
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }
    .protocol-src-hint, .protocol-src-stats { font-size: 0.7rem; color: var(--muted); }
    .protocol-src-toc, .protocol-src-body {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      overflow: auto;
      padding: 0.4rem;
    }
    .protocol-src-toc__title {
      margin: 0 0 0.35rem 0.12rem;
      font-size: 0.66rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .protocol-src-toc__btn {
      display: flex;
      justify-content: space-between;
      gap: 0.35rem;
      width: 100%;
      margin: 0.18rem 0;
      padding: 0.42rem 0.48rem;
      border-radius: 9px;
      border: 1px solid transparent;
      background: transparent;
      font: inherit;
      font-size: 0.74rem;
      text-align: left;
      cursor: pointer;
      color: var(--text);
    }
    .protocol-src-toc__btn.is-active,
    .protocol-src-toc__btn:hover {
      border-color: rgba(26,138,114,0.38);
      background: rgba(232,245,241,0.98);
      color: var(--green-800);
    }
    .protocol-src-toc__count {
      min-width: 1.15rem;
      text-align: center;
      font-size: 0.66rem;
      font-weight: 700;
      padding: 0.08rem 0.28rem;
      border-radius: 999px;
      background: rgba(226,232,240,0.85);
    }
    .protocol-src-section {
      margin-bottom: 0.45rem;
      border: 1px solid rgba(226,232,240,0.95);
      border-radius: 11px;
      overflow: hidden;
    }
    .protocol-src-section.is-active { border-color: rgba(26,138,114,0.35); }
    .protocol-src-section > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 0.45rem;
      padding: 0.48rem 0.58rem;
      background: rgba(248,250,252,0.9);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--green-800);
    }
    .protocol-src-section > summary::-webkit-details-marker { display: none; }
    .protocol-src-section__items { padding: 0.25rem 0.35rem 0.4rem; }
    .protocol-src-item {
      margin: 0.28rem 0;
      border-radius: 9px;
      border: 1px solid rgba(241,245,249,0.95);
    }
    .protocol-src-item > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      gap: 0.42rem;
      padding: 0.42rem 0.48rem;
      font-size: 0.76rem;
    }
    .protocol-src-item > summary::-webkit-details-marker { display: none; }
    .protocol-src-item__page {
      flex-shrink: 0;
      font-size: 0.64rem;
      font-weight: 700;
      padding: 0.14rem 0.38rem;
      border-radius: 999px;
      background: rgba(226,232,240,0.85);
      color: #475569;
    }
    .protocol-src-item__body {
      margin: 0;
      padding: 0 0.48rem 0.42rem 2.35rem;
      font-size: 0.74rem;
      color: #475569;
    }
    .protocol-src-item__meta {
      padding: 0 0.48rem 0.42rem 2.35rem;
      font-size: 0.68rem;
    }
    .protocol-src-item__meta a { color: var(--green-700); font-weight: 650; text-decoration: none; }
    .protocol-src-item__chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      padding: 0.1rem 0.48rem 0.4rem 2.35rem;
    }
    .protocol-src-chip {
      display: inline-block;
      padding: 0.14rem 0.5rem;
      border-radius: 999px;
      background: #eef7f1;
      border: 1px solid #cde8d8;
      font-size: 0.66rem;
      line-height: 1.35;
      color: #2f3d36;
    }
    .protocol-src-chip__label { font-weight: 700; color: var(--green-700); }
    .proto-src-mark { background: rgba(250,204,21,0.55); border-radius: 3px; }
    .proto-src-mark.is-current { background: rgba(251,146,60,0.75); }
    .protocol-src-empty, .protocol-src-loading { color: var(--muted); font-size: 0.82rem; padding: 0.75rem 0.2rem; }
  </style>
</head>
<body>
  <header class="pv-header">
    <h1 class="pv-title" id="pv-title">Навигация по протоколу</h1>
    <p class="pv-sub" id="pv-sub">Загрузка…</p>
  </header>
  <main class="pv-main" id="pv-root"></main>
  <script>
  (function () {
    var ORDER = ["diagnosis", "diagnostics", "treatment", "followup"];
    var INTENTS = {
      treatment: {
        sections: ["treatment"], tags: ["treatment", "drugs"], label: "Лечение",
        terms: ["лекарств", "препарат", "назнач", "терапи", "дозиров", "флп", "лечени", "фармакотерап", "хирург", "склеротерап", "компрессион"],
        phrases: ["какие лекарства", "что назначить", "чем лечить", "схема лечения", "какие препараты"]
      },
      diagnostics: {
        sections: ["diagnostics"], tags: ["diagnostics", "exams"], label: "Обследования",
        terms: ["обследован", "анализ", "уздс", "узи", "диагност", "лаборатор", "мрт", "кт", "экг", "оак"],
        phrases: ["какие обследования", "что сдать", "какие анализы", "какие исследования"]
      },
      diagnosis: {
        sections: ["diagnosis"], tags: ["diagnosis", "criteria"], label: "Диагноз",
        terms: ["диагноз", "классификац", "критери", "мкб", "стади"],
        phrases: ["критерии диагноза", "классификация"]
      },
      followup: {
        sections: ["followup"], tags: ["followup", "prevention", "routing"], label: "Наблюдение",
        terms: ["наблюден", "диспансер", "контроль", "профилактик", "маршрут", "направлен", "госпитализац"],
        phrases: ["как наблюдать", "куда направлять"]
      },
      contraindications: {
        sections: ["treatment", "diagnosis", "diagnostics"], tags: ["treatment", "criteria"], label: "Противопоказания",
        terms: ["противопоказан", "нельзя", "не применя", "абсолютн"],
        phrases: ["противопоказания", "когда нельзя"]
      }
    };
    function qp(name) {
      return new URLSearchParams(location.search).get(name) || "";
    }
    function esc(s) {
      return String(s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function escAttr(s) { return esc(s); }
    function escRx(s) { return String(s || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
    function norm(s) {
      return String(s || "").toLowerCase().replace(/ё/g, "е");
    }
    function hl(text, terms) {
      var e = esc(text);
      var list = Array.isArray(terms) ? terms : [terms];
      list = list.map(function (t) { return String(t || "").trim(); }).filter(function (t) { return t.length >= 2; });
      if (!list.length) return e;
      list.sort(function (a, b) { return b.length - a.length; });
      try {
        return e.replace(new RegExp("(" + list.map(escRx).join("|") + ")", "gi"), '<mark class="proto-src-mark">$1</mark>');
      } catch (err) { return e; }
    }
    function detectIntents(q) {
      q = norm(q);
      var found = [];
      Object.keys(INTENTS).forEach(function (key) {
        var intent = INTENTS[key];
        var hit = intent.phrases.some(function (p) { return q.indexOf(p) >= 0; });
        if (!hit) hit = intent.terms.some(function (t) { return q.indexOf(t) >= 0; });
        if (hit) found.push(key);
      });
      return found;
    }
    function expandTerms(q, intents) {
      var terms = [];
      var seen = {};
      function add(t) {
        t = norm(t);
        if (t.length < 2 || seen[t]) return;
        seen[t] = true;
        terms.push(t);
      }
      norm(q).split(/[^a-zа-я0-9.]+/i).forEach(function (tok) { if (tok.length >= 3) add(tok); });
      if (norm(q).length >= 2) add(q);
      (intents || []).forEach(function (key) {
        (INTENTS[key].terms || []).slice(0, 8).forEach(add);
      });
      return terms;
    }
    function scoreItem(item, sectionId, q, intents, terms) {
      var blob = norm(item.search_blob || "");
      var text = norm((item.lead || "") + " " + (item.body || ""));
      var score = 0;
      q = norm(q);
      if (q.length >= 2 && (text.indexOf(q) >= 0 || blob.indexOf(q) >= 0)) score += 12;
      (intents || []).forEach(function (key) {
        var intent = INTENTS[key];
        if (!intent) return;
        if (intent.sections.indexOf(sectionId) >= 0) score += 10;
        (intent.tags || []).forEach(function (tag) {
          if ((item.intent_tags || []).indexOf(tag) >= 0) score += 6;
        });
      });
      (terms || []).forEach(function (term) {
        if (term.length < 3) return;
        if (blob.indexOf(term) >= 0 || text.indexOf(term) >= 0) score += term.length >= 5 ? 3 : 2;
      });
      (item.entity_terms || []).forEach(function (ent) {
        ent = norm(ent);
        if (q && ent.indexOf(q) >= 0) score += 8;
        (terms || []).forEach(function (term) {
          if (ent.indexOf(term) >= 0) score += 4;
        });
      });
      return score;
    }
    function filterView(view, q) {
      q = String(q || "").trim();
      if (!q || q.length < 2) {
        return { view: view, terms: [], matchCount: 0, intents: [] };
      }
      var intents = detectIntents(q);
      var terms = expandTerms(q, intents);
      var sections = {};
      var toc = [];
      var matchCount = 0;
      var labels = view.section_labels || {};
      ORDER.forEach(function (sec) {
        var scored = [];
        ((view.sections || {})[sec] || []).forEach(function (item) {
          var sc = scoreItem(item, sec, q, intents, terms);
          if (sc > 0) scored.push({ item: item, score: sc });
        });
        scored.sort(function (a, b) { return b.score - a.score; });
        if (!scored.length) return;
        if (intents.length) {
          var ok = intents.some(function (key) {
            return INTENTS[key] && INTENTS[key].sections.indexOf(sec) >= 0;
          });
          if (!ok && scored[0].score < 8) return;
        }
        sections[sec] = scored.map(function (row) { return row.item; });
        matchCount += sections[sec].length;
        toc.push({ id: sec, label: labels[sec] || sec, count: sections[sec].length });
      });
      var hlTerms = terms.filter(function (t) { return t.length >= 3 && t.length <= 24; });
      if (q.length >= 2 && q.length <= 40) hlTerms.unshift(q);
      return {
        view: { toc: toc, sections: sections, section_labels: labels, stats: view.stats || {} },
        terms: hlTerms.slice(0, 10),
        matchCount: matchCount,
        intents: intents
      };
    }
    function pdfHref(path, page) {
      var u = "/api/protocol-pdf?path=" + encodeURIComponent(path || "");
      return page ? u + "#page=" + page : u;
    }
    function chipsHtml(entities) {
      if (!entities || !entities.length) return "";
      var out = '<div class="protocol-src-item__chips">';
      entities.forEach(function (chip) {
        var items = (chip && chip.items) || [];
        if (!items.length) return;
        out += '<span class="protocol-src-chip"><span class="protocol-src-chip__label">' +
          esc(chip.label || "") + "</span> " + esc(items.join(", ")) + "</span>";
      });
      return out + "</div>";
    }
    function itemHtml(path, item, terms, open) {
      var page = item.page;
      var hasBody = item.body && item.body !== item.lead;
      return (
        '<details class="protocol-src-item"' + (open ? " open" : "") + ">" +
        "<summary>" +
        (page ? '<span class="protocol-src-item__page">стр. ' + esc(page) + "</span>" : "") +
        '<span class="protocol-src-item__lead">' + hl(item.lead, terms) + "</span></summary>" +
        (hasBody ? '<p class="protocol-src-item__body">' + hl(item.body, terms) + "</p>" : "") +
        chipsHtml(item.entities) +
        (page ? '<p class="protocol-src-item__meta"><a href="' + escAttr(pdfHref(path, page)) +
          '" target="_blank" rel="noopener">PDF · стр. ' + esc(page) + "</a></p>" : "") +
        "</details>"
      );
    }
    function bodyHtml(path, baseView, q, active, renderOpts) {
      renderOpts = renderOpts || {};
      var filtered = renderOpts.semanticView
        ? { view: renderOpts.semanticView, terms: renderOpts.terms || [q], matchCount: renderOpts.matchCount || 0, intents: renderOpts.intents || [] }
        : filterView(baseView, q);
      var view = filtered.view;
      var terms = filtered.terms.length ? filtered.terms : q;
      var labels = view.section_labels || {};
      var openAll = !!(q && String(q).trim().length >= 2);
      var html = "";
      ORDER.forEach(function (sec) {
        var items = (view.sections || {})[sec] || [];
        if (!items.length) return;
        var open = openAll || !active || active === sec;
        html += '<details class="protocol-src-section' + (active === sec ? " is-active" : "") +
          '" id="proto-src-sec-' + escAttr(sec) + '" data-src-section="' + escAttr(sec) + '"' +
          (open ? " open" : "") + "><summary><span>" + esc(labels[sec] || sec) +
          '</span><span class="protocol-src-toc__count">' + items.length + "</span></summary>" +
          '<div class="protocol-src-section__items">';
        items.forEach(function (it, i) { html += itemHtml(path, it, terms, i === 0 && open); });
        html += "</div></details>";
      });
      if (!html && q && String(q).trim().length >= 2) {
        return '<p class="protocol-src-empty">Ничего не найдено по запросу.</p>';
      }
      return html || '<p class="protocol-src-empty">Нет данных по этому протоколу.</p>';
    }
    function fetchSemantic(path, query) {
      return fetch("/api/protocol-semantic-search?path=" + encodeURIComponent(path) + "&q=" + encodeURIComponent(query), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; });
    }
    function fetchOverview(path, query, title) {
      return fetch("/api/protocol-overview", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: path, q: query, title: title || "" })
      }).then(function (r) { return r.ok ? r.json() : null; });
    }
    function overviewHtml(overview, path) {
      if (!overview || !overview.ok) return "";
      var html = '<p class="protocol-src-overview__title">ИИ-сводка по протоколу</p>';
      if (overview.summary) html += '<p class="protocol-src-overview__summary">' + esc(overview.summary) + "</p>";
      var points = overview.points || [];
      if (points.length) {
        html += '<ul class="protocol-src-overview__points">';
        points.forEach(function (pt) {
          var cite = pt.page
            ? '<a class="protocol-src-overview__cite" href="' + escAttr(pdfHref(path, pt.page)) + '" target="_blank" rel="noopener">стр. ' + esc(pt.page) + "</a>"
            : "";
          html += '<li class="protocol-src-overview__point">' + esc(pt.text || "") + cite + "</li>";
        });
        html += "</ul>";
      }
      return html;
    }
    function wire(path, doc, q, active) {
      var baseView = doc.view;
      var root = document.getElementById("pv-root");
      var shell =
        '<div class="protocol-src-viewer">' +
        '<div class="protocol-src-toolbar">' +
        '<input class="protocol-src-search" type="search" placeholder="Лекарства, обследования, диагноз…" value="' + escAttr(q) + '" />' +
        '<a class="pv-pdf-btn" href="' + escAttr(pdfHref(path, 0)) + '" target="_blank" rel="noopener">PDF</a>' +
        '<span class="protocol-src-hint">Enter - следующее</span>' +
        '<span class="protocol-src-stats" hidden></span></div>' +
        '<div class="protocol-src-overview is-empty" aria-live="polite"></div>' +
        '<div class="protocol-src-intent-chips">' +
        '<button type="button" class="protocol-src-intent-chip" data-src-intent="treatment">Лечение</button>' +
        '<button type="button" class="protocol-src-intent-chip" data-src-intent="diagnostics">Обследования</button>' +
        '<button type="button" class="protocol-src-intent-chip" data-src-intent="diagnosis">Диагноз</button>' +
        '<button type="button" class="protocol-src-intent-chip" data-src-intent="followup">Наблюдение</button>' +
        '<button type="button" class="protocol-src-intent-chip" data-src-intent="contraindications">Противопоказания</button>' +
        "</div>" +
        '<nav class="protocol-src-toc" id="pv-toc"></nav>' +
        '<div class="protocol-src-body" id="pv-body"></div></div>';
      root.innerHTML = shell;
      var toc = document.getElementById("pv-toc");
      var body = document.getElementById("pv-body");
      var search = root.querySelector(".protocol-src-search");
      var stats = root.querySelector(".protocol-src-stats");
      var overview = root.querySelector(".protocol-src-overview");
      var semanticReqId = 0;
      function renderToc(query, tocView, tocOpts) {
        tocOpts = tocOpts || {};
        var filtered = tocOpts.skipFilter
          ? { view: tocView, matchCount: tocOpts.matchCount || 0, intents: tocOpts.intents || [] }
          : filterView(baseView, query);
        var tocHtml = '<p class="protocol-src-toc__title">Разделы</p>';
        (filtered.view.toc || baseView.toc || []).forEach(function (t) {
          tocHtml += '<button type="button" class="protocol-src-toc__btn' +
            (active === t.id ? " is-active" : "") + '" data-src-toc="' + escAttr(t.id) + '"><span>' +
            esc(t.label) + '</span><span class="protocol-src-toc__count">' + t.count + "</span></button>";
        });
        toc.innerHTML = tocHtml;
        toc.querySelectorAll("[data-src-toc]").forEach(function (b) {
          b.addEventListener("click", function () { jump(b.getAttribute("data-src-toc") || ""); });
        });
        if (stats) {
          if (query && query.trim().length >= 2) {
            stats.hidden = false;
            var cnt = tocOpts.matchCount != null ? tocOpts.matchCount : filtered.matchCount;
            stats.textContent = cnt > 0 ? "Найдено: " + cnt + (tocOpts.skipFilter ? " · семантика" : "") : "Ничего не найдено";
          } else {
            stats.hidden = true;
            stats.textContent = "";
          }
        }
        root.querySelectorAll(".protocol-src-intent-chip").forEach(function (chip) {
          chip.classList.toggle("is-active", (tocOpts.intents || filtered.intents).indexOf(chip.getAttribute("data-src-intent") || "") >= 0);
        });
      }
      function jump(sec) {
        var el = body.querySelector("#proto-src-sec-" + sec);
        if (!el) return;
        el.open = true;
        toc.querySelectorAll("[data-src-toc]").forEach(function (b) {
          b.classList.toggle("is-active", b.getAttribute("data-src-toc") === sec);
        });
        el.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      var mi = 0;
      function focusMark(n) {
        var marks = body.querySelectorAll(".proto-src-mark");
        if (!marks.length) return;
        mi = ((n % marks.length) + marks.length) % marks.length;
        marks.forEach(function (m, i) { m.classList.toggle("is-current", i === mi); });
        marks[mi].scrollIntoView({ behavior: "smooth", block: "center" });
      }
      function apply(query) {
        var qstr = String(query || "").trim();
        if (qstr.length < 2) {
          if (overview) {
            overview.innerHTML = "";
            overview.classList.add("is-empty");
            overview.classList.remove("is-loading");
          }
          renderToc(qstr);
          body.innerHTML = bodyHtml(path, baseView, qstr, active);
          mi = 0;
          return;
        }
        if (overview) {
          overview.classList.remove("is-empty");
          overview.classList.add("is-loading");
          overview.innerHTML = '<p class="protocol-src-overview__title">ИИ-сводка по протоколу</p><p class="protocol-src-overview__summary">Загрузка…</p>';
        }
        var reqId = ++semanticReqId;
        fetchSemantic(path, qstr).then(function (sem) {
          if (reqId !== semanticReqId) return;
          if (sem && sem.ok && sem.view) {
            renderToc(qstr, sem.view, { skipFilter: true, matchCount: sem.match_count || 0, intents: sem.intents || [] });
            body.innerHTML = bodyHtml(path, baseView, qstr, active, {
              semanticView: sem.view,
              terms: [qstr],
              matchCount: sem.match_count || 0,
              intents: sem.intents || []
            });
          } else {
            renderToc(qstr);
            body.innerHTML = bodyHtml(path, baseView, qstr, active);
          }
          mi = 0;
          setTimeout(function () { focusMark(0); }, 30);
        });
        fetchOverview(path, qstr, doc.title || "").then(function (ov) {
          if (reqId !== semanticReqId || !overview) return;
          overview.classList.remove("is-loading");
          var html = overviewHtml(ov, path);
          overview.innerHTML = html;
          if (!html) overview.classList.add("is-empty");
        });
      }
      apply(q);
      var timer;
      search.addEventListener("input", function () {
        clearTimeout(timer);
        timer = setTimeout(function () { apply(search.value); }, 180);
      });
      search.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") { ev.preventDefault(); focusMark(mi + 1); }
      });
      root.querySelectorAll(".protocol-src-intent-chip").forEach(function (chip) {
        chip.addEventListener("click", function () {
          var key = chip.getAttribute("data-src-intent") || "";
          var intent = INTENTS[key];
          if (!intent) return;
          var next = intent.phrases[0] || intent.label;
          if (search.value === next) {
            search.value = "";
            apply("");
            return;
          }
          search.value = next;
          apply(next);
        });
      });
      if (active) jump(active);
      else if (q) setTimeout(function () { focusMark(0); }, 80);
    }
    var path = qp("path");
    var section = qp("section");
    var q = qp("q");
    if (!path) {
      document.getElementById("pv-sub").textContent = "Не указан протокол.";
      return;
    }
    fetch("/api/protocol-source-text?path=" + encodeURIComponent(path), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (doc) {
        if (!doc || !doc.view || !doc.view.toc || !doc.view.toc.length) {
          document.getElementById("pv-sub").textContent = "Нет данных по этому протоколу.";
          return;
        }
        document.getElementById("pv-title").textContent = doc.title || "Протокол Минздрава";
        document.getElementById("pv-sub").textContent = "";
        document.title = (doc.title || "Протокол") + " - навигация";
        wire(path, doc, q, section);
      })
      .catch(function () {
        document.getElementById("pv-sub").textContent = "Ошибка загрузки.";
      });
  })();
  </script>
</body>
</html>
