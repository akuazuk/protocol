# Веса блоков итоговой оценки соответствия КЗ (ТЗ kz_compliance_checker §14.2).
weights:
  documentation_score: 0.15
  patient_data_score: 0.10
  protocol_applicability_score: 0.15
  diagnosis_score: 0.20
  required_exams_score: 0.15
  treatment_score: 0.15
  safety_score: 0.05
  follow_up_score: 0.05
  # legacy aliases (scoring.py dedupes)
  structural_score: 0.15
  protocol_match_score: 0.15

# Legacy keys (если новые блоки None - fallback в scoring.py)
legacy_weights:
  protocol_match_score: 0.15
  diagnosis_score: 0.20
  required_exams_score: 0.20
  treatment_score: 0.20
  safety_score: 0.15
  documentation_quality_score: 0.10

status_thresholds:
  compliant: 90
  mostly_compliant: 75
  partially_compliant: 50
  non_compliant: 1
