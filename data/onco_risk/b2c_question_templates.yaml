# B2C: нейтральные наводящие вопросы пациенту для разговора с врачом.
# ПРАВИЛО: без процентов, без диагноза, без слов из forbidden_words.
# Тон - поддержка и информирование, не тревога. Всегда есть safety-netting (когда вернуться).
version: "2026-06-30"

forbidden_words: ["рак", "онколог", "онкология", "злокачественн", "опухол", "метастаз", "карцином", "саркома", "меланом"]

# Вопросы по триггеру-признаку (trigger = feature id из likelihood_ratios.yaml).
by_feature:
  weight_loss:
    - "Уточните у врача причину снижения веса и какие обследования помогут её прояснить."
  rectal_bleeding:
    - "Спросите врача, целесообразно ли обследование кишечника и анализ кала."
  abdominal_pain:
    - "Уточните, что может вызывать боль в животе и нужны ли дополнительные обследования."
  diarrhoea:
    - "Спросите, нужно ли установить причину изменения стула и какие анализы помогут."
  haemoptysis:
    - "Обязательно обсудите с врачом появление крови при кашле и нужное обследование."
  dyspnoea:
    - "Уточните причину одышки и нужны ли дополнительные исследования."
  cough_persistent:
    - "Спросите, нужно ли обследование при длительном кашле (например, снимок)."
  dysphagia:
    - "Уточните у врача причину затруднения глотания и нужное обследование."
  jaundice:
    - "Обязательно обсудите пожелтение кожи или глаз с врачом в ближайшее время."
  haematuria:
    - "Спросите, что может вызывать примесь крови в моче и какие обследования нужны."
  urinary_retention:
    - "Уточните причину затруднённого мочеиспускания и нужные обследования."
  anaemia_male:
    - "Спросите, нужно ли установить причину низкого гемоглобина и контроль анализов."
  anaemia_female:
    - "Спросите, нужно ли установить причину низкого гемоглобина и контроль анализов."

# Вопросы по контексту.
by_context:
  screening:
    - "Уточните у врача, показаны ли вам профилактические обследования по возрасту."
  hereditary:
    - "Обсудите семейную историю заболеваний и нужна ли консультация генетика."
  surveillance:
    - "Уточните график ваших контрольных обследований и к кому обращаться при вопросах."

# Универсальные (safety-netting) - добавляются всегда, когда есть хотя бы один вопрос.
safety_netting:
  - "Спросите врача, в какой срок повторно показаться, если симптом сохраняется или усиливается."
  - "Уточните, при каких признаках нужно обратиться раньше назначенного срока."

# Подсказки L-Intake (что полезно сообщить врачу), когда данных мало - нейтрально.
intake_hints_b2c:
  symptom_duration:
    - "Подготовьте для врача, как давно длится симптом и как он меняется."
  relevant_labs:
    - "Возьмите на приём результаты недавних анализов, если они есть."
  family_history:
    - "Вспомните семейную историю заболеваний - это важно врачу."
