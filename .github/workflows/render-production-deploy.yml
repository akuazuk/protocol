name: Production Render release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-render
  cancel-in-progress: false

jobs:
  release:
    name: production-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify workflow SHA is current origin/main
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Deploy and verify exact main commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PROTOCOL_PROD_URL: https://protocol-bimy.onrender.com
        run: |
          scripts/ops/render_release_main.sh \
            --commit="$GITHUB_SHA" \
            --timeout-sec=900 \
            --interval-sec=20
