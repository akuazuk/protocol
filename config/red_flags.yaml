# Красные флаги безопасности (ТЗ раздел 6/17).
# severity: low | medium | high | critical
red_flags:
  possible_malignancy:
    keywords:
      - опухолевое образование
      - нельзя исключить инвазию
      - подозрение на злокачественное
      - злокачественн
      - образование кишки
      - новообразование
    severity: critical
    cap_if_unhandled: 45
    expected_actions:
      - дообследование
      - консультация профильного специалиста
      - маршрутизация
      - повторная консультация

  thrombosis:
    keywords:
      - флеботромбоз
      - тромбоз глубоких вен
      - тгв
      - тромбофлебит
    severity: high
    cap_if_unhandled: 55
    expected_actions:
      - антикоагулянтная терапия
      - контроль узи
      - повторная консультация

  systemic_autoimmune:
    keywords:
      - дискоидная красная волчанка
      - системная красная волчанка
      - ana
      - anti-dna
    severity: medium
    cap_if_unhandled: 65
    expected_actions:
      - лабораторное обследование
      - консультация ревматолога по показаниям
      - фотозащита

  severe_infection:
    keywords:
      - сепсис
      - септическ
      - высокая температура
      - фебрильн
      - гнойн
    severity: high
    cap_if_unhandled: 55
    expected_actions:
      - антибактериальная терапия
      - госпитализация по показаниям
      - контроль

  gi_bleeding_anemia:
    keywords:
      - железодефицит
      - анемия
      - кровопотер
      - мелена
      - кровотечени
    severity: high
    cap_if_unhandled: 50
    expected_actions:
      - дообследование
      - консультация профильного специалиста
      - контроль анализов

  drug_safety:
    keywords:
      - преднизолон
      - гидроксихлорохин
      - ривароксабан
      - ривороксабан
    severity: medium
    cap_if_unhandled: 60
    expected_actions:
      - длительность
      - контроль безопасности
      - повторная явка
