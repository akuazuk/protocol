# Детские онко-сигналы (для контекста pediatric). Порог направления ниже взрослого.
# Источник: NICE NG12 (раздел про детей и подростков). Числовые PPV NICE для детей не задаёт.
version: "2026-06-30"
source: {ref: "NICE NG12 children and young people", url: "https://www.nice.org.uk/guidance/ng12"}

signals:
  - id: persistent_lymphadenopathy
    label_ru: Стойкая лимфаденопатия
    keywords: ["лимфоузл", "лимфаденопат", "увеличен лимфоуз"]
  - id: bone_pain
    label_ru: Необъяснимая боль в костях
    keywords: ["боль в кост", "костн боль"]
  - id: unexplained_petechiae
    label_ru: Петехии / необъяснимые синяки
    keywords: ["петехи", "синяк", "кровоподтёк", "кровоподтек"]
  - id: morning_vomiting_headache
    label_ru: Утренняя рвота + головная боль
    keywords: ["утренняя рвота", "рвота утром", "головная боль с рвот"]
  - id: hepatosplenomegaly
    label_ru: Гепато-/спленомегалия
    keywords: ["гепатомегал", "спленомегал", "увеличение печени", "увеличение селезён"]
  - id: unexplained_mass
    label_ru: Необъяснимое объёмное образование
    keywords: ["образование", "припухлость", "уплотнение"]

# B2C для родителя - максимально мягко, без тревожных слов.
b2c_questions_parent:
  - "Уточните у врача, нужно ли дополнительно обследовать ребёнка и в какой срок показаться повторно."
  - "Спросите, при каких признаках нужно обратиться к врачу раньше."
