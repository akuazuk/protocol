# Конфигурация линтера ruff (см. CI: .github/workflows/ci.yml).
# Цель - ловить реальные баги, не превращая CI в правку стиля на тысячи строк.
line-length = 100
target-version = "py311"

extend-exclude = [
    ".venv",
    "venv",
    "node_modules",
    "output",
    "minzdrav_protocols",
    "corpus_chunks_parts",
    "archive",
]

[lint]
# Включено (набор подобран по фактическому числу срабатываний, всё вычищено до нуля):
#   F     - pyflakes: неопределённые имена, неиспользуемые импорты/переменные;
#   E9    - синтаксис и ошибки выполнения;
#   W     - пробелы в конце строк, отсутствие перевода строки в конце файла;
#   B     - flake8-bugbear: настоящие ловушки (замыкание по переменной цикла,
#           дубли в set-литералах, assert False, re.split с позиционным maxsplit);
#   ASYNC - блокирующие вызовы в async-функциях (важно: сервер на FastAPI);
#   LOG,G - неправильное использование logging (f-строки вместо %s, logging.warn);
#   RSE   - лишние скобки в raise;
#   ISC   - неявная склейка строк.
select = ["F", "E9", "W", "B", "ASYNC", "LOG", "G", "RSE", "ISC"]

# Осознанно выключено, а не «не дошли руки»:
ignore = [
    # B905: zip(...) без strict=. 46 срабатываний, все на равных по длине
    # последовательностях; добавление strict= меняет поведение на исключение.
    "B905",
    # B007: неиспользуемая переменная цикла. Чистый стиль, правка ради правки.
    "B007",
    # B005: .strip() с многосимвольной строкой. Здесь это НЕ ошибка: в парсерах
    # клинического текста аргумент - намеренный НАБОР символов
    # (например .strip(" \n\t: - -"), .rstrip(" ,;:-- - ")). «Исправление»
    # поменяло бы обрезку текста протоколов. Ср. hyphen-dash.mdc: скрипт
    # normalize_ui_dashes.py тоже пропускает строки с .strip(...).
    "B005",
]

# Набор, который стоит подключать по частям отдельными задачами (замеры на
# 2026-09-05, чтобы не мерить заново):
#   E    2954  - в основном длина строк, нужен прогон форматтера;
#   S    5790  - bandit; из них 5422 assert в тестах (нормально), а S105
#                «hardcoded password» здесь 4 ложных срабатывания по имени
#                переменной (regex, промпт, локальная фикстура бенчмарка).
#                Реальные CVE ловит pip-audit/Trivy в CI, а не эвристика по имени;
#   S110  151  - except: pass, см. фазу 6.2 плана (там же 109 из основного кода);
#   S608   62  - SQL из строк, требует ревизии витрины MO;
#   T20   747  - print в скриптах, для CLI это норма;
#   TRY   313  - переработка обработки исключений;
#   UP    310  - модернизация синтаксиса;
#   ARG   305  - неиспользуемые аргументы;
#   BLE   309  - except Exception;
#   I     172  - порядок импортов (нужен один прогон --fix по всему дереву);
#   EXE   156  - shebang без chmod +x;
#   PTH    23  - os.path -> pathlib.

[lint.per-file-ignores]
# В тестах допустимы неиспользуемые импорты (фикстуры) и переопределения.
"tests/**" = ["F401", "F811"]
