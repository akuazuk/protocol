name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Одна группа на PR или на ref main. Другие вкладки не делят группу
  # и не отменяют этот прогон: новый push встаёт в очередь, а не убивает watch.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-rag.txt -r requirements-dev.txt

      # Серверный барьер против ПДн: локальный pre-commit устанавливается
      # вручную и на машинах агентов обычно отсутствует, поэтому запрет
      # должен работать и в CI. См. docs/reports/2026-09-05-prod-state-snapshot.md.
      - name: Персональные данные не попадают в репозиторий
        run: python3 scripts/ops/check_no_phi_staged.py --all

      # Прод-образ ставит зависимости из requirements-rag.lock, поэтому lock не
      # должен отставать от requirements-rag.txt. Проверяется согласованность,
      # а не «свежесть»: обновления версий приносит Dependabot.
      - name: Lock зависимостей согласован
        run: python3 scripts/ops/check_requirements_lock.py

      - name: Ruff (lint)
        run: ruff check .

      # Проверяется явный список модулей из pyproject.toml [tool.mypy], а не
      # весь репозиторий: см. комментарий там же.
      - name: Mypy (зона типизации)
        run: mypy

      # Порог покрытия - «трещотка», а не цель: 75.13% - фактический замер на
      # 2026-09-05 (clinical_knowledge + backend). Гейт стоит на 70%, чтобы
      # пропускать разницу окружений (часть тестов в CI скипается без MIS DSN),
      # и поднимается по мере роста покрытия. Понижать порог, чтобы «прошло», -
      # нельзя: смысл именно в том, что вниз он не двигается.
      - name: Pytest (с порогом покрытия)
        env:
          # Без ключа API: тесты не должны ходить во внешнюю модель.
          RAG_GEMINI_EMBED_RERANK: "0"
        run: |
          pytest -q \
            --cov=clinical_knowledge --cov=backend \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=70

      - name: Search golden (mini corpus)
        env:
          RAG_GEMINI_EMBED_RERANK: "0"
          RAG_CHUNKS_JSONL: tests/fixtures/chunks.mini.jsonl
        run: pytest tests/test_search_golden.py tests/test_search_retrieval.py -q

      - name: Repo layout smoke (scripts wrappers)
        run: bash scripts/ops/smoke_repo_layout.sh

  # Уязвимости зависимостей и конфигураций. Разделение блокирующего и
  # отчётного намеренное: pip-audit блокирует, потому что на 2026-09-05 все
  # requirements*.txt чисты (проверено локально) - значит любая находка это
  # регресс, внесённый в PR. Trivy по Dockerfile пока только отчёт: образы
  # запускаются от root, и переход на непривилегированного пользователя
  # требует chown смонтированного /var/data (см. docs/deploy/gce-production-runbook.md),
  # то есть отдельной согласованной задачи, а не флага в CI.
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      # Каждый файл отдельно: у контуров (rag/llm-worker/mis-bridge) разные
      # наборы, и объединённый прогон скрыл бы, какой именно контур уязвим.
      - name: pip-audit (зависимости прода и контуров)
        run: |
          status=0
          for f in requirements.txt requirements-rag.txt requirements-dev.txt \
                   requirements-llm-worker.txt requirements-mis-bridge.txt; do
            echo "::group::pip-audit $f"
            pip-audit -r "$f" --progress-spinner off || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Trivy (конфигурации Dockerfile, отчёт)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: config
          scan-ref: deploy
          severity: CRITICAL,HIGH
          exit-code: "0"

  # E2E в браузере. Ловит то, что не видят серверные тесты: страница отдаётся
  # с кодом 200, но CSP или проверка целостности (SRI) блокирует собственные
  # скрипты - у врача не работает часть интерфейса, а в логах сервера чисто.
  # Сервер поднимается с ENABLE_DEFAULT_CSP=1, как в проде (см. playwright.config.ts).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-rag.txt

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        env:
          CI: "1"
        run: npx playwright test

      # Трассы и скриншоты падений могут содержать клинический текст со
      # страницы, поэтому срок хранения короткий.
      - name: Upload artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 5
          if-no-files-found: ignore

  docker-images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build protocol-gcp-app
        run: docker build -f deploy/gcp-app/Dockerfile -t protocol-gcp-app:ci .

      - name: Build protocol-gcp-llm
        run: docker build -f deploy/gcp-llm/Dockerfile -t protocol-gcp-llm:ci .

      - name: Build protocol-mis-bridge
        run: docker build -f deploy/mac-bridge/Dockerfile -t protocol-mis-bridge:ci .

      - name: Build protocol-by-home (stub)
        run: docker build -f deploy/by-home/Dockerfile -t protocol-by-home:ci .

  manifest-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-rag.txt -r requirements-dev.txt

      - name: Pytest (lazy manifest startup)
        env:
          RAG_GEMINI_EMBED_RERANK: "0"
          RAG_STARTUP_MODE: manifest
          RAG_LAZY_CHUNK_STORE: "1"
          RAG_MANIFEST_PATH: data/catalog/corpus_path_manifest.jsonl
          RAG_LEX_SHARDS_DIR: data/catalog/lex_shards
          RAG_PATH_LEX_SHARDS: "1"
          RAG_FORBID_FULL_CORPUS_RETRIEVE: "1"
          CONSULT_L2_FAST: "1"
        run: |
          pytest tests/test_corpus_path_manifest.py tests/test_chunk_store.py \
            tests/test_lazy_retrieve.py tests/test_consult_l2_fast.py \
            tests/test_consult_evidence_quality.py tests/test_respiratory_path_filters.py \
            tests/test_plan_definition_export.py -q
