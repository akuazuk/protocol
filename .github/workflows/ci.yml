name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-rag.txt -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Pytest
        env:
          # Без ключа API: тесты не должны ходить во внешнюю модель.
          RAG_GEMINI_EMBED_RERANK: "0"
        run: pytest -q
