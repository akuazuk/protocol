name: PR overlap notify

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

# Отдельная группа на каждый PR, без отмены: комментарий не должен гасить соседний.
concurrency:
  group: pr-overlap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  notify:
    if: github.event.action != 'closed' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comment overlapping PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ops/pr_isolation.py github-notify
        continue-on-error: true
